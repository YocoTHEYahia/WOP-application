<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <!-- White background -->
  <rect width="400" height="160" fill="white"/>
  
  <!-- W - clean, curved -->
  <path d="M30,125 L38,40 L58,80 L78,40 L86,125" 
        fill="none" stroke="#1E3A8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- O - perfect circle -->
  <circle cx="135" cy="82" r="32" 
          fill="none" stroke="#1E3A8A" stroke-width="10"/>
  
  <!-- P as map pinpoint - classic teardrop pin -->
  <!-- Pin body (teardrop) -->
  <path d="M210,125 
           L210,70 
           Q210,45 185,45 
           Q160,45 160,70 
           Q160,95 185,95 
           Q210,95 210,70 Z" 
        fill="#1E3A8A"/>
  <!-- Inner white circle (map pin hole) -->
  <circle cx="185" cy="62" r="14" fill="white"/>
  <!-- Center dot (optional - GPS dot) -->
  <circle cx="185" cy="62" r="4" fill="#1E3A8A"/>

</svg>